<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FOMO EVM 买入监控</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="eyebrow">FOMO EVM BUY MONITOR</div>
        <h1>FOMO EVM 买入监控</h1>
        <p>从私有监控 API 读取买入事件，显示 EVM 目标代币和合约地址。</p>
      </header>
      <section class="config" aria-label="监控配置">
        <label class="field">
          <span>后端 API 地址</span>
          <input id="api-base" type="url" inputmode="url" placeholder="https://example.com" autocomplete="off">
        </label>
        <button id="save-config" class="secondary full" type="button">保存配置</button>
        <div class="config-row"><span>插件模式</span><strong>客户端展示</strong></div>
        <div class="config-row"><span>识别路径</span><strong>API → Relay 事件</strong></div>
        <div class="config-row"><span>结果页面</span><strong>任意 HTTPS 页面浮层</strong></div>
      </section>
      <div class="actions">
        <button id="show" class="primary" type="button">显示悬浮窗</button>
        <button id="check" class="secondary" type="button">刷新连接</button>
      </div>
      <section class="events" aria-label="最近买入记录">
        <div class="events-title">最近 EVM 买入</div>
        <div id="events-list" class="events-list">正在读取…</div>
      </section>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
    <script src="relay-core.js"></script>
    <script src="monitor-config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
